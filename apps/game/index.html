<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b6cb0" />
    <meta name="description" content="Collect creatures across floating sky islands, together." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nebotok" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Nebotok</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-screen="profiles">
    <div id="world" aria-hidden="true"></div>
    <div id="names" aria-hidden="true"></div>
    <div class="joystick" aria-hidden="true" hidden><div class="joystick-knob"></div></div>
    <section id="profiles" class="screen" hidden></section>
    <header class="hud">
      <div class="hud-left">
        <h1 class="title" data-text="game.title">Nebotok</h1>
        <p class="badge" role="status" aria-live="polite" data-status="connecting">
          <span class="badge-dot" aria-hidden="true"></span>
          <span class="badge-text"></span>
        </p>
      </div>
      <button class="settings-button" type="button" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill-rule="evenodd"
            d="M19.78 10.13 22.4 10.52 22.4 13.48 19.78 13.87 18.82 16.18 20.4 18.3 18.3 20.4 16.18 18.82 13.87 19.78 13.48 22.4 10.52 22.4 10.13 19.78 7.82 18.82 5.7 20.4 3.6 18.3 5.18 16.18 4.22 13.87 1.6 13.48 1.6 10.52 4.22 10.13 5.18 7.82 3.6 5.7 5.7 3.6 7.82 5.18 10.13 4.22 10.52 1.6 13.48 1.6 13.87 4.22 16.18 5.18 18.3 3.6 20.4 5.7 18.82 7.82zM15.5 12a3.5 3.5 0 1 0 -7 0a3.5 3.5 0 1 0 7 0z"
          />
        </svg>
      </button>
    </header>
    <div id="settings" class="settings" role="group" hidden>
      <p class="settings-language"></p>
      <button class="language" type="button">
        <span class="language-option" data-language="en">EN</span>
        <span class="language-option" data-language="sl">SL</span>
      </button>
      <p class="settings-controls"></p>
      <button class="controls" type="button">
        <span class="language-option" data-controls="tap"></span>
        <span class="language-option" data-controls="joystick"></span>
      </button>
      <button class="switch-player secondary" type="button" hidden></button>
    </div>
    <p class="welcome" hidden></p>
    <p class="toast" role="status" aria-live="polite" hidden></p>
    <div class="walk-hint" aria-hidden="true" hidden>
      <div class="walk-hint-pad"></div>
      <div class="walk-hint-ripple"></div>
      <svg class="walk-hint-hand" viewBox="0 0 24 24" focusable="false">
        <path d="M9 4.5a1.5 1.5 0 0 1 3 0V10h.5a1.5 1.5 0 0 1 1.5 1a1.5 1.5 0 0 1 2.5.5a1.5 1.5 0 0 1 2.5 1V16a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L5 15.2a1.5 1.5 0 0 1 2.4-1.8L9 15z" />
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

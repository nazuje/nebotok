# The production stack on the Mac mini. Start and update it with scripts/update.sh, which verifies
# the image's build attestation before anything runs. Never `docker compose down -v`: that deletes
# the world saves.
#
#   app         the game server, built by our own CI and pinned by digest. It sees no host folders
#               and no Docker socket, and can write only to its own data volume and /tmp. Its port
#               is published on 127.0.0.1 only, never on the home network; the Mac's own Tailscale
#               shares it with the tailnet over HTTPS on port 8445 (scripts/serve.sh).
#   litestream  has no network at all. It copies the database from the data volume to BACKUP_DIR on
#               the Mac as it changes, and the game's nightly snapshots with it. The only container
#               with a host folder.
# Sidecar mode, where the game is its own Tailscale device instead, adds compose.tailscale.yaml on
# top of this file (docs/deploy.md, "Sidecar mode").
name: nebotok

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  app:
    <<: *hardening
    image: ghcr.io/nazuje/nebotok@${NEBOTOK_DIGEST:?run scripts/update.sh to set NEBOTOK_DIGEST in .env}
    user: node
    environment:
      NODE_ENV: production
      # Inside the container, so the published port can reach it; the Mac's side is 127.0.0.1 only.
      HOST: 0.0.0.0
      PORT: "2567"
      DATA_DIR: /data
      LOG_LEVEL: info
      # Docker's port forwarding, and so the Mac's Tailscale Serve, reaches the game from this
      # network's gateway. X-Forwarded-For is believed from that peer only.
      TRUST_PROXY: ${NEBOTOK_NETWORK:-10.231.67}.1
    ports:
      - "127.0.0.1:${NEBOTOK_PORT:-8567}:2567"
    volumes:
      - nebotok-data:/data
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2567/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Colyseus closes every room on SIGTERM before exiting.
    stop_grace_period: 30s

  litestream:
    <<: *hardening
    # litestream/litestream:0.5.17 (the Debian build: its sh runs deploy/litestream/copy-snapshots.sh)
    image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
    # The game's own uid (node), so it can read and checkpoint the database files the game owns.
    user: "1000:1000"
    network_mode: none
    command: [replicate, -config, /etc/litestream/litestream.yml, -exec, sh /etc/litestream/copy-snapshots.sh]
    volumes:
      - nebotok-data:/data
      - ./deploy/litestream:/etc/litestream:ro
      # Refuses to start rather than create a new, empty folder when BACKUP_DIR is mistyped.
      # scripts/update.sh creates the default folder when BACKUP_DIR is not set.
      - type: bind
        source: ${BACKUP_DIR:-${HOME}/NebotokBackups}
        target: /backups
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    # Litestream makes a last sync of the database on SIGTERM.
    stop_grace_period: 30s

# A fixed subnet, so the gateway TRUST_PROXY names is known. NEBOTOK_NETWORK moves both together, for
# a second stack on the same Mac; compose.local.yaml uses the range just after the default one.
networks:
  default:
    ipam:
      config:
        - subnet: ${NEBOTOK_NETWORK:-10.231.67}.0/28
          gateway: ${NEBOTOK_NETWORK:-10.231.67}.1

volumes:
  nebotok-data:

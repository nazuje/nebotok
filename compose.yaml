# The production stack on the Mac mini. Start and update it with scripts/update.sh, which verifies
# the image's build attestation before anything runs. Never `docker compose down -v`: that deletes
# the world saves and the Tailscale identity.
#
# Two containers share one network namespace:
#   ts          joins the tailnet as tag:nebotok and serves https://<TS_HOSTNAME>.<tailnet>.ts.net,
#               proxying it to the game on 127.0.0.1:2567. No ports are published on the Mac.
#   app         the game server, built by our own CI and pinned by digest. It sees no host folders
#               and no Docker socket, and can write only to its own data volume and /tmp.
# A third has no network at all:
#   litestream  copies the database from the data volume to BACKUP_DIR on the Mac as it changes,
#               and the game's nightly snapshots with it. The only container with a host folder.
name: nebotok

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  ts:
    <<: *hardening
    # tailscale/tailscale:v1.104.4 (stable)
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env (see .env.example)}
      TS_HOSTNAME: ${TS_HOSTNAME:-nebotok}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking needs no /dev/net/tun and no NET_ADMIN, so every capability is dropped.
      TS_USERSPACE: "true"
      # Use the auth key only for the first login; after that the state volume keeps the identity.
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:nebotok
      TS_TAILSCALED_EXTRA_ARGS: --no-logs-no-support
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      # Tailscale watches a directory, not a single file, for serve config changes. Read-only.
      - ./deploy/tailscale:/config:ro
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  app:
    <<: *hardening
    image: ghcr.io/nazuje/nebotok@${NEBOTOK_DIGEST:?run scripts/update.sh to set NEBOTOK_DIGEST in .env}
    user: node
    network_mode: service:ts
    depends_on:
      ts:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Only Tailscale Serve, inside the same namespace, needs to reach the game.
      HOST: 127.0.0.1
      PORT: "2567"
      DATA_DIR: /data
      LOG_LEVEL: info
    volumes:
      - nebotok-data:/data
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2567/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Colyseus closes every room on SIGTERM before exiting.
    stop_grace_period: 30s

  litestream:
    <<: *hardening
    # litestream/litestream:0.5.17 (the Debian build: its sh runs deploy/litestream/copy-snapshots.sh)
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    # The game's own uid (node), so it can read and checkpoint the database files the game owns.
    user: "1000:1000"
    network_mode: none
    command: [replicate, -config, /etc/litestream/litestream.yml, -exec, sh /etc/litestream/copy-snapshots.sh]
    volumes:
      - nebotok-data:/data
      - ./deploy/litestream:/etc/litestream:ro
      # Refuses to start rather than create a new, empty folder when BACKUP_DIR is mistyped.
      - type: bind
        source: ${BACKUP_DIR:?set BACKUP_DIR in .env to the backup folder (see .env.example)}
        target: /backups
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    # Litestream makes a last sync of the database on SIGTERM.
    stop_grace_period: 30s

volumes:
  tailscale-state:
  nebotok-data:

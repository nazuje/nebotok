# Local test of the production image, without Tailscale: builds from source and serves the game on
# http://127.0.0.1:2567 only (this computer, not the network). Same hardening as compose.yaml.
# Its own project name keeps it apart from the production stack and its volumes, and Litestream
# backs it up to its own folder, NEBOTOK_LOCAL_BACKUP_DIR, never to the Mac mini's BACKUP_DIR.
#   NEBOTOK_LOCAL_BACKUP_DIR=<an empty folder> docker compose -f compose.local.yaml up -d --build --wait
#   docker compose -f compose.local.yaml down        (never add -v unless you mean to wipe the data)
# `npm run verify:container` runs this and checks it from outside and inside.
name: nebotok-local

services:
  app:
    build:
      context: .
    image: nebotok:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: node
    environment:
      NODE_ENV: production
      # Inside the container, so the published port can reach it; the host side is 127.0.0.1 only.
      HOST: 0.0.0.0
      PORT: "2567"
      DATA_DIR: /data
      LOG_LEVEL: info
      # As in compose.yaml: the published port reaches the game from this network's gateway.
      TRUST_PROXY: 10.231.67.17
    ports:
      - "127.0.0.1:${NEBOTOK_LOCAL_PORT:-2567}:2567"
    volumes:
      - nebotok-data:/data
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2567/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  litestream:
    # The same image as compose.yaml; scripts/compose.test.mjs keeps the two pins equal.
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    network_mode: none
    command: [replicate, -config, /etc/litestream/litestream.yml, -exec, sh /etc/litestream/copy-snapshots.sh]
    volumes:
      - nebotok-data:/data
      - ./deploy/litestream:/etc/litestream:ro
      - type: bind
        source: ${NEBOTOK_LOCAL_BACKUP_DIR:?set NEBOTOK_LOCAL_BACKUP_DIR to a folder for the local test's backups}
        target: /backups
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# Next to production's subnet, never overlapping it, so both stacks can run on one Mac.
networks:
  default:
    ipam:
      config:
        - subnet: 10.231.67.16/28
          gateway: 10.231.67.17

volumes:
  nebotok-data:

# Sidecar mode: the game as its own Tailscale device (tag:nebotok), instead of behind the Mac's own
# Tailscale. Not the default; for later, for example friends on the tailnet who should reach only
# the game, or a host without Tailscale. It goes on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.tailscale.yaml ...
# or, for every command and script, COMPOSE_FILE=compose.yaml:compose.tailscale.yaml in .env.
# Setup and the tailnet policy: docs/deploy.md ("Sidecar mode") and deploy/tailscale/policy.md.
#
#   ts    joins the tailnet as tag:nebotok and serves https://<TS_HOSTNAME>.<tailnet>.ts.net,
#         proxying it to the game on 127.0.0.1:2567 inside the network namespace they share.
#   app   moves into that namespace and publishes no port on the Mac at all.
# Never `docker compose down -v`: that also deletes the Tailscale identity.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ts:
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging
    # tailscale/tailscale:v1.104.4 (stable)
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env for sidecar mode (see .env.example)}
      TS_HOSTNAME: ${TS_HOSTNAME:-nebotok}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking needs no /dev/net/tun and no NET_ADMIN, so every capability is dropped.
      TS_USERSPACE: "true"
      # Use the auth key only for the first login; after that the state volume keeps the identity.
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:nebotok
      TS_TAILSCALED_EXTRA_ARGS: --no-logs-no-support
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      # Tailscale watches a directory, not a single file, for serve config changes. Read-only.
      - ./deploy/tailscale:/config:ro
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  app:
    network_mode: service:ts
    # A container in another's network namespace cannot publish ports; Tailscale Serve is the way in.
    ports: !reset []
    depends_on:
      ts:
        condition: service_healthy
    environment:
      # Only Tailscale Serve, inside the same namespace, needs to reach the game.
      HOST: 127.0.0.1
      # Tailscale Serve connects from loopback here; the network's gateway is not a proxy.
      TRUST_PROXY: loopback

volumes:
  tailscale-state:
